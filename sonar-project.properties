# Required metadata
sonar.projectKey=plant-io-backend
sonar.projectName=Plant IO Backend
sonar.projectVersion=1.0.0

# Path to the source code to be analyzed.
# This excludes files ending with .test.ts to prevent them from being indexed as source code.
sonar.sources=./src
sonar.exclusions=node_modules/**, dist/**, **/*.test.ts

# Path to the test files.
# This ensures only files ending with .test.ts are indexed as test files.
sonar.tests=./src
sonar.test.inclusions=**/*.test.ts

# The parameter that points to the LCOV report file generated by `c8`
sonar.javascript.lcov.reportPaths=./coverage/lcov.info

# SonarQube server URL and login token.
sonar.host.url=https://sonarcloud.io